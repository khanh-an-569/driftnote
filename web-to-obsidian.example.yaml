# Copy this file to web-to-obsidian.yaml and keep the real file uncommitted.
vault_root: "D:/Notes/Second Brain"

folders:
  inbox: "00 Inbox/Web"
  sources: "10 Sources"
  knowledge: "20 Knowledge"
  mocs: "30 MOCs"
  projects: "40 Projects"

capture:
  default_mode: "source-only"
  default_language: "vi"
  tavily: "fallback"
  min_content_chars: 400

privacy:
  public_web_only: true
  blocked_domains:
    - "mail.google.com"
    - "drive.google.com"
    - "localhost"
